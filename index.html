    <!-- Courier Prime is the site font wherever Consolas isn't installed (Mac, iOS, Android;
         Consolas only ships with Windows), and the business card font everywhere. Noto covers
         Thai/Burmese glyphs, which neither has.
         All are served split by unicode-range, so a page with no Thai/Burmese text downloads
         no Noto files. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+Myanmar:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap" />
